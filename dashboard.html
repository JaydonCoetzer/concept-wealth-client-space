<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Concept Wealth</title>
<link rel="stylesheet" href="css/trustfile.css">
<script src="js/cw-profile.js"></script>
<style>.snap{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.snap-card{display:block;text-decoration:none;}
.snap-card:hover{border-color:var(--teal);box-shadow:var(--shadow-sm);}
.snap-big{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.01em;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums;}
.snap-sub{font-size:13px;color:var(--muted);}
@media(max-width:620px){.snap{grid-template-columns:1fr;}}</style>
</head>
<body>
<div class="tf-wrap"><div id="dash"></div></div>
<script src="js/topbar.js" data-page="dashboard"></script>
<script>
function fmtR(v){ if(v==null||isNaN(v)||!isFinite(v)) return 'R 0'; var n=Math.round(Math.abs(v)); return (v<0?'-R ':'R ')+n.toLocaleString('en-ZA').replace(/,/g,' '); }
function res(id){ try{ var r=CWProfile.getResult&&CWProfile.getResult(id); return r&&r.results?r.results:null; }catch(e){ return null; } }
function profile(){ try{ return CWProfile.getProfile&&CWProfile.getProfile(); }catch(e){ return null; } }

var SVG={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
function band(v){ return v>=85?'Comprehensive':v>=60?'Well covered':v>=35?'Building':'Starting out'; }

// Build one snapshot card (from saved data, or a "not yet" prompt)
function card(title, data, href){
  if(!data) return '<a class="tf-card snap-card" href="'+href+'">'+
    '<p class="tf-card-title" style="margin:0 0 8px;">'+title+'</p>'+
    '<div class="snap-big" style="color:var(--faint);font-size:17px;">Not calculated yet</div>'+
    '<div class="snap-sub" style="color:var(--teal);font-weight:700;">Calculate now &rarr;</div></a>';
  return '<a class="tf-card snap-card" href="'+href+'">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;"><p class="tf-card-title" style="margin:0;">'+title+'</p>'+
    '<span class="tf-tag tf-tag-'+data.cls+'">'+data.status+'</span></div>'+
    '<div class="snap-big">'+data.big+'</div><div class="snap-sub">'+data.sub+'</div></a>';
}

function build(){
  var p=profile(), signedIn=!!p, name=signedIn?(p.firstName||'there'):'Lerato';

  // per-area snapshots from saved results (or sample when signed out)
  var rt=res('retirement'), bg=res('budget'), nw=res('net_worth'), lc=res('life_cover');
  var retData, budData, nwData, lcData;
  if(signedIn){
    retData = rt ? { status: rt.dep?('Depletes '+rt.dep):'On track', cls: rt.dep?'amber':'green', big: fmtR(rt.sustainM)+' /mo', sub:'Income your fund supports' } : null;
    budData = bg ? { status: bg.left<0?'Overspending':'Saving '+Math.round(bg.rate)+'%', cls: bg.left<0?'red':'green', big: fmtR(bg.left)+' /mo', sub:'Left after spending' } : null;
    nwData  = nw ? { status: nw.net>=0?'Positive':'Negative', cls: nw.net>=0?'green':'red', big: fmtR(nw.net), sub:'Assets less debts' } : null;
    lcData  = lc ? { status: lc.gap>0?'Gap':'Covered', cls: lc.gap>0?'amber':'green', big: lc.gap>0?fmtR(lc.gap)+' short':'Fully covered', sub:'Life cover vs need' } : null;
  } else {
    retData={status:'On track',cls:'green',big:'R 19 500 /mo',sub:'Income your fund supports'};
    budData={status:'Saving 17%',cls:'green',big:'R 3 500 /mo',sub:'Left after spending'};
    nwData ={status:'Positive',cls:'green',big:'R 3 935 000',sub:'Assets less debts'};
    lcData ={status:'Gap',cls:'amber',big:'R 1 200 000 short',sub:'Life cover vs need'};
  }

  // overall readiness
  var KEY=['retirement','budget','net_worth','life_cover','estate_cost'], done=0;
  KEY.forEach(function(id){ if(res(id)) done++; });
  var money=signedIn?Math.round(done/KEY.length*100):79;
  var file=0; var f=res('family_file'); if(f&&typeof f.score==='number') file=f.score; if(!signedIn) file=62;
  var overall=Math.round((money+file)/2);

  // next actions
  var gaps=[];
  if(file<100) gaps.push({t:'Complete your Family File',s:'Will, policies and final wishes in one place.',href:'trustfile.html'});
  if(!rt||!signedIn) gaps.push({t:'Project your retirement',s:'See whether your money will last.',href:'retirement_calculator.html'});
  if(!lc||!signedIn) gaps.push({t:'Check your life cover',s:'Make sure your family is covered.',href:'life_cover_calculator.html'});
  gaps=gaps.slice(0,3);

  document.getElementById('dash').innerHTML =
    (signedIn?'':'<div class="tf-callout tf-callout-amber" style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><span>A <b>sample</b> portfolio. Start your profile and use a calculator to see your real numbers.</span><a href="profile.html" class="tf-btn tf-btn-primary tf-btn-sm">Start free</a></div>')+
    '<p class="dash-hello">Your financial portfolio</p>'+
    '<h1 class="dash-title">'+name+'</h1>'+

    '<div class="tf-card" style="display:flex;align-items:center;gap:22px;margin-bottom:18px;">'+
      '<div class="ring" style="--val:'+overall+';--size:118px;flex-shrink:0;"><div class="ring-inner"><div class="ring-pct">'+overall+'%</div><div class="ring-lbl">Ready</div></div></div>'+
      '<div style="flex:1;"><div class="tf-tag tf-tag-'+(gaps.length?'amber':'green')+'" style="margin-bottom:8px;">'+(gaps.length?gaps.length+' things to do':'All up to date')+'</div>'+
        '<div style="font-size:18px;font-weight:700;color:var(--ink);">'+band(overall)+'</div>'+
        '<div style="font-size:13.5px;color:var(--muted);margin-top:3px;max-width:42ch;">A snapshot across your money and your family file. Use a calculator and it updates here.</div></div>'+
    '</div>'+

    '<p class="tf-card-title" style="margin:0 0 12px 2px;">At a glance</p>'+
    '<div class="snap" style="margin-bottom:18px;">'+
      card('Retirement', retData, 'retirement_calculator.html')+
      card('Budget', budData, 'budget_planner.html')+
      card('Net worth', nwData, 'net_worth_calculator.html')+
      card('Life cover', lcData, 'life_cover_calculator.html')+
    '</div>'+

    (gaps.length ? '<p class="tf-card-title" style="margin:0 0 12px 2px;">Next actions</p><div class="tf-stack" style="gap:10px;margin-bottom:18px;">'+
      gaps.map(function(g){ return '<a class="tf-card" href="'+g.href+'" style="display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;padding:15px 18px;">'+
        '<div><div style="font-size:14.5px;font-weight:700;color:var(--ink);">'+g.t+'</div><div style="font-size:13px;color:var(--muted);">'+g.s+'</div></div>'+
        '<span class="tf-btn tf-btn-ghost tf-btn-sm">Do it</span></a>'; }).join('')+'</div>' : '')+

    '<div class="tf-card adviser-card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;"><div><div style="font-size:16px;font-weight:700;margin-bottom:2px;">Want a person to check this?</div><div style="font-size:13.5px;color:rgba(255,255,255,.75);">Book a 20-minute review with your Concept Wealth adviser.</div></div><a class="tf-btn tf-btn-ghost tf-btn-sm" style="background:#fff;border-color:#fff;color:var(--navy);" href="'+(window.CW_ADVISOR_CONTACT||'#')+'">Book a review</a></div>';
}
build();
</script>
</body>
</html>
