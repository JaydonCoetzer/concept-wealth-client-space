<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Concept Wealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/trustfile.css">
<script src="js/cw-profile.js"></script>
</head>
<body>
<div class="tf-wrap"><div id="dash"></div></div>
<script src="js/topbar.js" data-page="dashboard"></script>
<script>
var MONEY_CALCS = ['retirement','budget','net_worth','life_cover','estate_cost'];
function pctDone(ids){ var d=0; ids.forEach(function(id){ try{ if(CWProfile.getResult&&CWProfile.getResult(id)) d++; }catch(e){} }); return Math.round(d/ids.length*100); }
function has(id){ try{ return !!(CWProfile.getResult&&CWProfile.getResult(id)); }catch(e){ return false; } }
function realData(){
  var p=null; try{ p=CWProfile.getProfile&&CWProfile.getProfile(); }catch(e){}
  if(!p) return null;
  var money=pctDone(MONEY_CALCS), file=0;
  try{ var f=CWProfile.getResult('family_file'); if(f&&f.results&&typeof f.results.score==='number') file=f.results.score; }catch(e){}
  return { name:p.firstName||'there', money:money, file:file, sample:false };
}
var SAMPLE={ name:'Lerato', money:79, file:62, sample:true };
var SVG={ file:'<path d="M4 4h9l3 3h4v13H4z"/><path d="M4 9h16"/>', chart:'<path d="M4 20V6M10 20V10M16 20V4M4 20h16"/>', shield:'<path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z"/><path d="M9 12l2 2 4-4"/>', estate:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M5 10v6c0 1 3 3 7 3s7-2 7-3v-6"/>', budget:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>' };
function ic(n){ return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+SVG[n]+'</svg>'; }
function band(v){ return v>=85?'Comprehensive':v>=60?'Well covered':v>=35?'Building':'Starting out'; }
function nextActions(d){
  var a=[];
  if(d.file<100) a.push({t:'Complete your Family File',s:'Record your will, policies and final wishes so your family can find everything.',href:'trustfile.html',ico:'file'});
  if(!has('retirement')||d.sample) a.push({t:'Project your retirement',s:'See whether your savings will last, and the income you can expect.',href:'tools.html',ico:'chart'});
  if(!has('life_cover')||d.sample) a.push({t:'Check your life cover',s:'Find out if your family would be covered, and by how much.',href:'tools.html',ico:'shield'});
  if(!has('estate_cost')||d.sample) a.push({t:'Estimate your estate costs',s:'See the duty, fees and cash your estate will need one day.',href:'estate_cost_calculator.html',ico:'estate'});
  return a.slice(0,3);
}
function render(){
  var d=realData()||SAMPLE, overall=Math.round((d.money+d.file)/2), gaps=nextActions(d);
  var tiles=[{n:'Estate costs',s:'What your estate will cost',href:'estate_cost_calculator.html',i:'estate'},
             {n:'Retirement',s:'Will my money last?',href:'tools.html',i:'chart'},
             {n:'Budget',s:'Income vs expenses',href:'tools.html',i:'budget'},
             {n:'Life cover',s:'Am I covered?',href:'tools.html',i:'shield'}];
  document.getElementById('dash').innerHTML =
    (d.sample?'<div class="tf-callout tf-callout-amber" style="margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;"><span>This is a <b>sample dashboard</b>. Start your own profile to see your real numbers.</span><a href="profile.html" class="tf-btn tf-btn-primary tf-btn-sm">Start free</a></div>':'')+
    '<p class="dash-hello">Welcome back</p><h1 class="dash-title">'+d.name+'</h1>'+
    '<div class="dash-top">'+
      '<div class="tf-card dash-ring-card"><div class="ring" style="--val:'+overall+'"><div class="ring-inner"><div class="ring-pct">'+overall+'%</div><div class="ring-lbl">Ready</div></div></div>'+
        '<div><div class="tf-tag tf-tag-'+(gaps.length?'amber':'green')+'" style="margin-bottom:10px;">'+(gaps.length?gaps.length+' things to do':'All up to date')+'</div>'+
        '<div style="font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em;">'+band(overall)+'</div>'+
        '<div style="font-size:13.5px;color:var(--muted);margin-top:3px;max-width:30ch;">Your money and your family file, in one place. Small steps move this number.</div></div></div>'+
      '<div class="tf-card"><p class="tf-card-title">Your readiness</p>'+
        '<div class="meter"><div class="meter-head"><span class="meter-name">My money</span><span class="meter-val">'+d.money+'%</span></div><div class="meter-bar"><div class="meter-fill money" style="width:'+d.money+'%"></div></div></div>'+
        '<div class="meter"><div class="meter-head"><span class="meter-name">My family file</span><span class="meter-val">'+d.file+'%</span></div><div class="meter-bar"><div class="meter-fill file" style="width:'+d.file+'%"></div></div></div></div>'+
    '</div>'+
    '<div class="tf-card" style="margin-bottom:18px;"><div class="tf-card-head"><p class="tf-card-title" style="margin:0;">Next actions</p>'+(gaps.length?'<span class="tf-tag tf-tag-amber">'+gaps.length+' gaps found</span>':'')+'</div>'+
      (gaps.length?gaps.map(function(g){ return '<div class="na-card"><div class="na-ico">'+ic(g.ico)+'</div><div class="na-body"><p class="na-title">'+g.t+'</p><p class="na-sub">'+g.s+'</p></div><a class="tf-btn tf-btn-ghost tf-btn-sm na-go" href="'+g.href+'">Do it</a></div>'; }).join(''):'<div class="tf-callout tf-callout-teal">You are all caught up.</div>')+'</div>'+
    '<p class="tf-card-title" style="margin:0 0 12px 2px;">Your tools</p>'+
    '<div class="tiles" style="margin-bottom:18px;">'+tiles.map(function(t){ return '<a class="tile" href="'+t.href+'"><div class="tile-ico">'+ic(t.i)+'</div><div class="tile-name">'+t.n+'</div><div class="tile-sub">'+t.s+'</div></a>'; }).join('')+'</div>'+
    '<div class="tf-card adviser-card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;"><div><div style="font-size:16px;font-weight:800;margin-bottom:2px;">Want a person to check this?</div><div style="font-size:13.5px;color:rgba(255,255,255,.75);">Book a 20-minute review with your Concept Wealth adviser.</div></div><a class="tf-btn tf-btn-ghost tf-btn-sm" style="background:#fff;border-color:#fff;" href="'+(window.CW_ADVISOR_CONTACT||'#')+'">Book a review</a></div>';
}
render();
</script>
</body>
</html>
