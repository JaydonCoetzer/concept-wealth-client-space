<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Concept Wealth</title>
<link rel="stylesheet" href="css/trustfile.css">
<script src="js/cw-profile.js"></script>
</head>
<body>
<div class="tf-wrap"><div id="home"></div></div>
<script src="js/topbar.js" data-page="home"></script>
<script>
var KEY=['retirement','budget','net_worth','life_cover','estate_cost'];
function has(id){ try{ return !!(CWProfile.getResult&&CWProfile.getResult(id)); }catch(e){ return false; } }
function pctDone(){ var d=0; KEY.forEach(function(id){ if(has(id)) d++; }); return Math.round(d/KEY.length*100); }
function profileName(){ try{ var p=CWProfile.getProfile&&CWProfile.getProfile(); return p?(p.firstName||'there'):null; }catch(e){ return null; } }
function fileScore(){ try{ var f=CWProfile.getResult('family_file'); return (f&&f.results&&typeof f.results.score==='number')?f.results.score:0; }catch(e){ return 0; } }

var SVG={estate:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M5 10v6c0 1 3 3 7 3s7-2 7-3v-6"/>',chart:'<path d="M4 20V6M10 20V10M16 20V4M4 20h16"/>',budget:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',shield:'<path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z"/><path d="M9 12l2 2 4-4"/>',file:'<path d="M4 4h9l3 3h4v13H4z"/><path d="M4 9h16"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};
function ic(n,sz){ return '<svg viewBox="0 0 24 24" width="'+(sz||18)+'" height="'+(sz||18)+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+SVG[n]+'</svg>'; }

function render(){
  var name=profileName(), signedIn=!!name;
  var money=signedIn?pctDone():79, file=signedIn?fileScore():62, overall=Math.round((money+file)/2);
  var tools=[
    {n:'Estate costs',s:'What your estate will cost',href:'estate_cost_calculator.html',i:'estate'},
    {n:'Retirement',s:'Will my money last?',href:'retirement_calculator.html',i:'chart'},
    {n:'Budget',s:'Where my money goes',href:'budget_planner.html',i:'budget'},
    {n:'Life cover',s:'Am I covered?',href:'life_cover_calculator.html',i:'shield'}
  ];
  document.getElementById('home').innerHTML =
    '<p class="dash-hello">'+(signedIn?'Welcome back':'Welcome to your money, in one place')+'</p>'+
    '<h1 class="dash-title" style="margin-bottom:22px;">'+(signedIn?name:'Concept Wealth')+'</h1>'+

    // financial portfolio card -> dashboard
    '<a href="dashboard.html" class="tf-card" style="display:flex;align-items:center;gap:22px;text-decoration:none;margin-bottom:26px;background:linear-gradient(120deg,var(--navy),var(--sanlam));color:#fff;border:none;">'+
      '<div class="ring" style="--val:'+overall+';--size:100px;flex-shrink:0;"><div class="ring-inner"><div class="ring-pct" style="font-size:22px;color:#fff;">'+overall+'%</div></div></div>'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75;">Your financial portfolio</div>'+
        '<div style="font-size:21px;font-weight:700;margin:3px 0;">See how you are tracking</div>'+
        '<div style="font-size:13.5px;opacity:.85;">Retirement, budget, net worth and cover, one simple snapshot.</div>'+
      '</div>'+
      '<span class="tf-btn" style="background:#fff;color:var(--navy);flex-shrink:0;">Open '+ic('arrow',16)+'</span>'+
    '</a>'+

    '<p class="tf-card-title" style="margin:0 0 12px 2px;">Plan something</p>'+
    '<div class="tiles" style="margin-bottom:26px;">'+
      tools.map(function(t){ return '<a class="tile" href="'+t.href+'"><div class="tile-ico">'+ic(t.i)+'</div><div class="tile-name">'+t.n+'</div><div class="tile-sub">'+t.s+'</div></a>'; }).join('')+
    '</div>'+

    '<div class="tf-grid-2">'+
      '<a href="trustfile.html" class="tf-card" style="text-decoration:none;display:block;">'+
        '<div class="tile-ico" style="margin-bottom:12px;">'+ic('file')+'</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--ink);">Your family file</div>'+
        '<div style="font-size:13.5px;color:var(--muted);margin-top:3px;">Leave your family a plan, not a puzzle. Will, policies and final wishes in one safe place.</div>'+
        '<div style="font-size:13.5px;color:var(--teal);font-weight:700;margin-top:10px;">Open TrustFile '+ic('arrow',15)+'</div></a>'+
      '<a href="tools.html" class="tf-card" style="text-decoration:none;display:block;">'+
        '<div class="tile-ico" style="margin-bottom:12px;">'+ic('chart')+'</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--ink);">All the calculators</div>'+
        '<div style="font-size:13.5px;color:var(--muted);margin-top:3px;">Tax, savings, loans, net worth and more. Every tool in one place.</div>'+
        '<div style="font-size:13.5px;color:var(--teal);font-weight:700;margin-top:10px;">Browse tools '+ic('arrow',15)+'</div></a>'+
    '</div>';
}
render();
</script>
</body>
</html>
