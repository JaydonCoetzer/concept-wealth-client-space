<body>
<div class="app" id="app"><div class="app-main"><div class="app-content" id="sec"></div></div></div>

var s=new URLSearchParams(location.search).get('s')||'documents';
var d=SEC[s]||SEC.documents;
document.getElementById('sec').innerHTML =

document.title='TrustFile · '+d[0]+' | Concept Wealth';
